name: fetch photo

# A routine asks for a photograph by committing a small JSON file into
# requests/. It cannot fetch one itself: every stock photo host is blocked by
# its sandbox egress allowlist, and the r2 URL it uses for publishing is
# upload-only. This runner is on the open internet, and
# raw.githubusercontent.com is the one image host the sandbox can read back.
#
# The trigger is a push rather than repository_dispatch because the connector
# gates the dispatch tool behind an elicitation feature the routine's MCP
# client does not support. Committing a file is proven to work.
on:
  push:
    paths: ['requests/*.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-photo
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Fetch and normalise
        run: STAMP="$(date -u +%FT%TZ)" python3 scripts/fetch.py
      - name: Commit
        run: |
          git config user.name  "mavix-photo-bot"
          git config user.email "bot@mavixmarketing.com"
          git add live requests
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "photo: fetched $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash
            sleep 3
          done
          exit 1
